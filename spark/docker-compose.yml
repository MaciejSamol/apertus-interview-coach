# Apertus 1.5 8B on the DGX Spark (128 GB unified memory): full bf16, no quantisation.
# On the Spark:  docker compose up -d   then   docker compose logs -f
# Coach (on your PC) .env:  LLM_BASE_URL=http://<spark-ip>:8000/v1
services:
  vllm:
    image: ${VLLM_IMAGE:-ghcr.io/swiss-ai/vllm_apertus_1.5_release:latest-arm64}
    container_name: apertus-vllm
    restart: unless-stopped
    ipc: host
    entrypoint: ["vllm", "serve"]
    command: >
      swiss-ai/Apertus-v1.5-8B
      --served-model-name swiss-ai/Apertus-v1.5-8B
      --chat-template-content-format string
      --max-model-len ${VLLM_MAX_LEN:-32768}
      --gpu-memory-utilization ${VLLM_GPU_UTIL:-0.5}
      --max-num-seqs ${VLLM_MAX_SEQS:-32}
      ${VLLM_EXTRA_ARGS:-}
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf_cache:

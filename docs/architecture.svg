<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#0f172a">Apertus Interview Coach — architecture</text>
  <text x="40" y="70" font-size="14" fill="#475569">The code owns the conversation, the LLM fills slots · ~1.2 LLM calls per candidate answer · Apertus 1.5 8B, on-premise</text>

  <!-- Candidate / UI -->
  <rect x="40" y="110" width="200" height="120" rx="12" fill="#eef2ff" stroke="#6366f1"/>
  <text x="140" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">Candidate (14–16)</text>
  <text x="140" y="164" text-anchor="middle" font-size="13" fill="#312e81">Agent Chat UI · :3000</text>
  <text x="140" y="186" text-anchor="middle" font-size="12" fill="#4338ca">de · fr · it · Swiss German</text>
  <text x="140" y="206" text-anchor="middle" font-size="12" fill="#4338ca">voice-ready texts (TTS)</text>

  <!-- Aegra container -->
  <rect x="290" y="96" width="620" height="520" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="310" y="122" font-size="14" font-weight="700" fill="#334155">Coach API · Aegra + LangGraph · :2026 (graph "agent")</text>

  <!-- nodes -->
  <g font-size="13">
    <rect x="320" y="146" width="170" height="74" rx="10" fill="#ffffff" stroke="#334155"/>
    <text x="405" y="170" text-anchor="middle" font-weight="700" fill="#0f172a">setup</text>
    <text x="405" y="190" text-anchor="middle" font-size="11.5" fill="#475569">language · occupation ·</text>
    <text x="405" y="206" text-anchor="middle" font-size="11.5" fill="#475569">company · question plan</text>

    <rect x="320" y="262" width="170" height="80" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
    <text x="405" y="286" text-anchor="middle" font-weight="700" fill="#78350f">assess</text>
    <text x="405" y="305" text-anchor="middle" font-size="11.5" fill="#92400e">1 LLM call · JSON</text>
    <text x="405" y="322" text-anchor="middle" font-size="11.5" fill="#92400e">scores · quote · action · flags</text>

    <rect x="540" y="262" width="170" height="80" rx="10" fill="#ffffff" stroke="#334155"/>
    <text x="625" y="286" text-anchor="middle" font-weight="700" fill="#0f172a">decide</text>
    <text x="625" y="305" text-anchor="middle" font-size="11.5" fill="#475569">rules, no LLM: safety ·</text>
    <text x="625" y="322" text-anchor="middle" font-size="11.5" fill="#475569">probe · company Q · next</text>

    <rect x="540" y="146" width="170" height="74" rx="10" fill="#ffffff" stroke="#334155"/>
    <text x="625" y="170" text-anchor="middle" font-weight="700" fill="#0f172a">interviewer</text>
    <text x="625" y="190" text-anchor="middle" font-size="11.5" fill="#475569">mostly no LLM: question</text>
    <text x="625" y="206" text-anchor="middle" font-size="11.5" fill="#475569">verbatim + neutral reaction</text>

    <rect x="540" y="392" width="170" height="80" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
    <text x="625" y="416" text-anchor="middle" font-weight="700" fill="#78350f">feedback</text>
    <text x="625" y="435" text-anchor="middle" font-size="11.5" fill="#92400e">2 parallel LLM calls</text>
    <text x="625" y="452" text-anchor="middle" font-size="11.5" fill="#92400e">11 criteria · tips · summary</text>

    <rect x="740" y="146" width="150" height="190" rx="10" fill="#ecfdf5" stroke="#059669"/>
    <text x="815" y="170" text-anchor="middle" font-weight="700" fill="#065f46">Safety layer</text>
    <text x="815" y="194" text-anchor="middle" font-size="11.5" fill="#047857">distress → support +</text>
    <text x="815" y="210" text-anchor="middle" font-size="11.5" fill="#047857">referral (BIZ, teacher)</text>
    <text x="815" y="234" text-anchor="middle" font-size="11.5" fill="#047857">discouragement →</text>
    <text x="815" y="250" text-anchor="middle" font-size="11.5" fill="#047857">no difficult questions</text>
    <text x="815" y="274" text-anchor="middle" font-size="11.5" fill="#047857">manipulation /</text>
    <text x="815" y="290" text-anchor="middle" font-size="11.5" fill="#047857">discrimination → redirect</text>
    <text x="815" y="314" text-anchor="middle" font-size="11.5" fill="#047857">model flag + rules</text>

    <rect x="740" y="392" width="150" height="80" rx="10" fill="#ecfdf5" stroke="#059669"/>
    <text x="815" y="416" text-anchor="middle" font-weight="700" fill="#065f46">Feedback checks</text>
    <text x="815" y="436" text-anchor="middle" font-size="11.5" fill="#047857">levels = median (code)</text>
    <text x="815" y="452" text-anchor="middle" font-size="11.5" fill="#047857">real quotes · T3 · A1 · ss</text>
  </g>

  <!-- graph edges -->
  <path d="M490 183 L536 183" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M490 302 L536 302" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M625 262 L625 224" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M625 342 L625 388" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M710 302 L736 302" stroke="#059669" stroke-width="1.4" fill="none" stroke-dasharray="4 3"/>
  <path d="M710 432 L736 432" stroke="#059669" stroke-width="1.4" fill="none" stroke-dasharray="4 3"/>
  <text x="514" y="174" text-anchor="middle" font-size="10.5" fill="#64748b">1st turn</text>
  <text x="514" y="294" text-anchor="middle" font-size="10.5" fill="#64748b">answer</text>
  <text x="634" y="384" font-size="10.5" fill="#64748b">plan done</text>

  <!-- candidate <-> API -->
  <path d="M240 160 L316 170" stroke="#6366f1" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <path d="M316 302 C 270 302, 250 260, 240 214" stroke="#6366f1" stroke-width="1.8" fill="none" marker-start="url(#a)"/>
  <text x="250" y="150" font-size="11" fill="#4338ca">message</text>
  <text x="246" y="292" font-size="11" fill="#4338ca">next answer</text>

  <!-- Plan strip -->
  <rect x="320" y="500" width="570" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="335" y="522" font-size="13" font-weight="700" fill="#0f172a">Interview plan (FHGR phases → 6 stages, 10–15 main questions)</text>
  <g font-size="11.5" fill="#0f172a">
    <rect x="335" y="534" width="84" height="44" rx="8" fill="#e0f2fe"/><text x="377" y="560" text-anchor="middle">Introduction</text>
    <rect x="426" y="534" width="84" height="44" rx="8" fill="#e0f2fe"/><text x="468" y="560" text-anchor="middle">Motivation</text>
    <rect x="517" y="534" width="84" height="44" rx="8" fill="#e0f2fe"/><text x="559" y="552" text-anchor="middle">Strengths &amp;</text><text x="559" y="567" text-anchor="middle">weaknesses</text>
    <rect x="608" y="534" width="84" height="44" rx="8" fill="#e0f2fe"/><text x="650" y="560" text-anchor="middle">Situational</text>
    <rect x="699" y="534" width="84" height="44" rx="8" fill="#e0f2fe"/><text x="741" y="552" text-anchor="middle">Candidate</text><text x="741" y="567" text-anchor="middle">questions</text>
    <rect x="790" y="534" width="84" height="44" rx="8" fill="#fde68a"/><text x="832" y="560" text-anchor="middle">Feedback</text>
  </g>

  <!-- LLM server -->
  <rect x="960" y="230" width="200" height="150" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/>
  <text x="1060" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">Apertus 1.5 8B</text>
  <text x="1060" y="286" text-anchor="middle" font-size="12.5" fill="#9a3412">vLLM (Swiss AI fork)</text>
  <text x="1060" y="306" text-anchor="middle" font-size="12.5" fill="#9a3412">bf16 · &lt; 32 GB VRAM</text>
  <text x="1060" y="326" text-anchor="middle" font-size="12.5" fill="#9a3412">OpenAI-compatible :8000</text>
  <text x="1060" y="352" text-anchor="middle" font-size="11.5" fill="#9a3412">bundled or external</text>
  <!-- LLM call bus -->
  <g stroke="#b45309" stroke-width="1.5" fill="none" stroke-dasharray="5 4">
    <path d="M405 342 L405 364 L928 364"/>
    <path d="M625 472 L625 488 L928 488 L928 136"/>
    <path d="M625 146 L625 136 L928 136" stroke-opacity="0.55"/>
    <path d="M928 305 L956 305" stroke-dasharray="none" marker-end="url(#b)"/>
  </g>
  <text x="948" y="470" font-size="10.5" fill="#b45309" transform="rotate(-90 948 470)">LLM calls (OpenAI API)</text>
  <text x="700" y="132" font-size="10.5" fill="#b45309">greeting · company answers · support only</text>

  <!-- Data -->
  <rect x="40" y="646" width="870" height="86" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="60" y="672" font-size="13" font-weight="700" fill="#0f172a">FHGR / Profolio data (in the image)</text>
  <text x="60" y="694" font-size="12" fill="#334155">242 questions (de/fr/it + dialect) · 11×4 rubric + FHGR feedback rules · 706 expert-annotated answers (few-shot)</text>
  <text x="60" y="714" font-size="12" fill="#334155">30 postings (company facts) · 1,860 occupations (259 apprenticeships) from berufsberatung.ch · 28 scenarios (tests)</text>
  <path d="M465 646 L465 620" stroke="#475569" stroke-width="1.4" fill="none" marker-end="url(#a)"/>

  <rect x="960" y="646" width="200" height="86" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="1060" y="676" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">PostgreSQL · Redis</text>
  <text x="1060" y="698" text-anchor="middle" font-size="12" fill="#334155">threads, checkpoints,</text>
  <text x="1060" y="716" text-anchor="middle" font-size="12" fill="#334155">run queue (Aegra)</text>
  <path d="M910 600 C 960 610, 1000 620, 1030 642" stroke="#475569" stroke-width="1.4" fill="none" marker-end="url(#a)"/>

  <!-- legend -->
  <rect x="960" y="110" width="200" height="96" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="975" y="126" width="16" height="12" fill="#fffbeb" stroke="#b45309"/><text x="999" y="137" font-size="12" fill="#334155">uses the LLM</text>
  <rect x="975" y="150" width="16" height="12" fill="#ffffff" stroke="#334155"/><text x="999" y="161" font-size="12" fill="#334155">deterministic code</text>
  <rect x="975" y="174" width="16" height="12" fill="#ecfdf5" stroke="#059669"/><text x="999" y="185" font-size="12" fill="#334155">guardrails / checks</text>
</svg>
